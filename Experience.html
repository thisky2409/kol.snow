function stripNumberFormatting(value) {
return String(value == null ? '' : value).replace(/,/g, '').replace(/[^0-9.-]/g, '');
}
function formatInputNumber(value) {
const raw = stripNumberFormatting(value);
if (!raw || raw === '-' || raw === '.') return raw;
const parts = raw.split('.');
const integer = Number(parts[0] || 0).toLocaleString('en-US');
return parts.length > 1 ? integer + '.' + parts.slice(1).join('').slice(0, 4) : integer;
}
// Bug đã sửa: trước đây mỗi lần gõ, ô input được format lại (thêm dấu phẩy)
// nhưng con trỏ luôn bị đẩy về cuối chuỗi thay vì giữ đúng vị trí đang gõ/xoá.
// Ví dụ: gõ "100000" giữa chừng sửa lại 1 số, hoặc bấm xoá (backspace) ở giữa
// chuỗi — vì con trỏ bị "nhảy" sai chỗ nên ký tự tiếp theo bị chèn/xoá nhầm vị
// trí, gây ra hiện tượng nhập 100,000 lại ra 110,000, hoặc xoá số lại sinh
// thêm số 1. Hàm dưới đây định dạng lại giá trị NHƯNG tính toán đúng vị trí
// con trỏ mới dựa trên số ký tự "thật" (số, dấu chấm, dấu trừ — không tính
// dấu phẩy) nằm trước con trỏ cũ.
function formatNumericInputPreservingCaret_(input) {
const before = input.value;
const caretPos = input.selectionStart == null ? before.length : input.selectionStart;
const anchorsBeforeCaret = before.slice(0, caretPos).replace(/,/g, '').length;
input.value = formatInputNumber(before);
const formatted = input.value;
let pos = 0;
let seen = 0;
while (pos < formatted.length && seen < anchorsBeforeCaret) {
if (formatted[pos] !== ',') seen += 1;
pos += 1;
}
try { input.setSelectionRange(pos, pos); } catch (_) {}
}

state.shortlistDetailData.kols = state.shortlistDetailData.kols.filter(function (row) { return row.Shortlist_KOL_ID !== id; });
adjustShortlistSummary(state.shortlistDetailData.shortlist.Shortlist_ID, -1, removed && removed.Review_Status === 'Approved' ? -1 : 0);
renderShortlistDetailView(); showToast('KOL removed from shortlist.');
} catch (error) { showToast(error.message || String(error), true); }
}
function adjustShortlistSummary(id, totalDelta, approvedDelta) {
const shortlist = state.shortlists.find(function (item) { return item.Shortlist_ID === id; });
if (!shortlist) return;
shortlist.KOL_Count = Math.max(0, Number(shortlist.KOL_Count || 0) + Number(totalDelta || 0));
shortlist.Approved_Count = Math.max(0, Number(shortlist.Approved_Count || 0) + Number(approvedDelta || 0));
}
function patchWorkspaceRow(collection, idField, updated) {
const rows = state.campaignDetail[collection] || [];
const index = rows.findIndex(function (row) { return row[idField] === updated[idField]; });
if (index >= 0) rows[index] = Object.assign({}, rows[index], updated);
else rows.unshift(updated);
}
function enrichWorkspaceRecord(record) {
const kol = state.campaignDetail.campaignKols.find(function (row) { return row.Campaign_KOL_ID === record.Campaign_KOL_ID; }) || {};
return Object.assign({}, record, { Username: kol.Username || '', Display_Name: kol.Display_Name || '', Account_ID: record.Account_ID || kol.Account_ID || '' });
}
function syncCampaignKolFromRecord(record, field, explicitValue) {
const kol = state.campaignDetail.campaignKols.find(function (row) { return row.Campaign_KOL_ID === record.Campaign_KOL_ID; });
if (!kol) return;
kol[field] = explicitValue === undefined ? record[field] : explicitValue;
if (record.Posting_Date) kol.Posting_Date = record.Posting_Date;
if (record.Post_URL) kol.Post_URL = record.Post_URL;
}
function recalculateWorkspaceMetrics() {
const data = state.campaignDetail;
const kols = data.campaignKols || [];
const deliverables = data.deliverables || [];
const payments = data.payments || [];
const today = new Date(); today.setHours(0, 0, 0, 0);
const market = String(data.campaign && data.campaign.Market || '');
const committed = kols.filter(function (row) { return row.Booking_Status === 'Confirmed'; }).reduce(function (sum, row) { return sum + campaignKolBudgetAmountClient_(row, market); }, 0);
const pipelineTotal = kols.reduce(function (sum, row) { return sum + campaignKolBudgetAmountClient_(row, market); }, 0);
const paymentMap = {}; payments.forEach(function (row) { paymentMap[row.Campaign_KOL_ID] = row.Payment_Status; });
Object.assign(data.metrics, {
totalKols: kols.length,
confirmed: kols.filter(function (row) { return row.Booking_Status === 'Confirmed'; }).length,
committed: committed,
pipelineTotal: pipelineTotal,
remaining: Math.max(0, numericValue(data.campaign.Budget) - committed),
draftsInReview: deliverables.filter(function (row) { return row.Content_Status === 'Need edit'; }).length,
postsLive: deliverables.filter(function (row) { return row.Content_Status === 'Posted'; }).length,
missingContracts: kols.filter(function (row) { return row.Booking_Status === 'Confirmed' && row.Contract_Status !== 'Signed'; }).length,
overdueDeliverables: deliverables.filter(function (row) { const due = safeDate(row.Draft_Due || row.Posting_Date); return due && due < today && row.Content_Status !== 'Posted'; }).length,
pendingPayments: kols.filter(function (row) { const status = paymentMap[row.Campaign_KOL_ID] || row.Payment_Status || 'Not started'; return row.Booking_Status === 'Confirmed' && !['Paid','Cancelled'].includes(status); }).length,
});
}
function numericValue(value) {
return Number(stripNumberFormatting(value)) || 0;
}
/**
 * Mirrors campaignKolNetAmount_ in Code.gs: Final_Fee counts when it was
 * entered, not when it is truthy. Using `||` treated a barter deal's 0 as
 * missing and fell back to the quoted price, so the Net input, the Committed and
 * Remaining budget figures and the net sort all showed an amount the server
 * never counted.
 */
/**
 * Anything edited inside a campaign can change what the Operations screens show,
 * but those screens only fetch when their cache is falsy. Without this, setting a
 * payment to Paid inside a campaign left Operations → Payments showing the old
 * status indefinitely — the background poller had no branch for those views
 * either, so nothing healed it short of a full reload.
 */
function invalidateOperationsCaches_() {
if (state.operations) {
state.operations.contractData = null;
state.operations.contracts = null;
state.operations.payments = null;
state.operations.history = null;
}
if (state.contractHub) state.contractHub.data = null;
}
function campaignKolNetAmountClient_(row) {
row = row || {};
const raw = row.Final_Fee;
const hasFinal = !(raw === null || raw === undefined || String(raw).trim() === '');
return Math.max(0, numericValue(hasFinal ? raw : row.Quoted_Fee));
}
function campaignKolGrossAmountClient_(row) {
const netAmount = campaignKolNetAmountClient_(row);
const baseAmount = netAmount + Math.max(0, numericValue(row.Code_Ad_Fee));
// Công thức thuế nằm ở calculateContractTaxClient_ (Scripts.html), phản chiếu
// calculateContractTax_ trong Code.gs. Trước đây `>= 5000000 ? /0.9` được viết lại
// ở ĐÂY, trong CampaignWorkspace.html, và trong Code.gs — ba bản sao không có
// nguồn chung, nên đổi mô hình thuế là phải nhớ cả ba chỗ.
return Math.round(baseAmount) + calculateContractTaxClient_(baseAmount);
}
function campaignKolBudgetAmountClient_(row, market) {
if (String(market || row.Market || '') === 'VN') return campaignKolGrossAmountClient_(row);
return campaignKolNetAmountClient_(row) + numericValue(row.Tax) + numericValue(row.Service_Fee);
}
function patchCampaignSummary(updated) {
const index = state.campaigns.findIndex(function (campaign) { return campaign.Campaign_ID === updated.Campaign_ID; });
if (index >= 0) state.campaigns[index] = Object.assign({}, state.campaigns[index], updated);
}
let campaignSummaryRefreshTimer_ = 0;
function refreshCampaignSummariesInBackground() {
clearTimeout(campaignSummaryRefreshTimer_);
campaignSummaryRefreshTimer_ = setTimeout(function () {
Promise.all([server('getDashboardData'), server('listCampaigns', {})]).then(function (results) {
state.dashboard = results[0];
state.campaigns = results[1] || state.campaigns;
}).catch(function () {});
}, 900);
}
runBulkBookingUpdate = async function (button) {
if (!state.workspace.selectedKols.size) return;
const select = document.getElementById('bulk-booking-value');
const field = select.dataset.field || 'Booking_Status';
const ids = Array.from(state.workspace.selectedKols);
setActionBusy(button, true, 'Updating…');
try {
const result = await server('bulkUpdateCampaignKols', { ids: ids, field: field, value: select.value });
// This override used to just assign the new value locally and throw the response
// away, so the Gross / After_PIT_Fee the server recomputed stayed stale and the
// deliverables auto-created when a KOL flips to Confirmed never appeared.
const records = result.records || {};
if (Object.keys(records).length) {
Object.keys(records).forEach(function (rowId) {
patchWorkspaceRow('campaignKols', 'Campaign_KOL_ID', records[rowId]);
});
} else {
state.campaignDetail.campaignKols.forEach(function (row) { if (ids.includes(row.Campaign_KOL_ID)) row[field] = select.value; });
}
(result.deliverables || []).forEach(function (record) {
patchWorkspaceRow('deliverables', 'Deliverable_ID', enrichWorkspaceRecord(record));
});
state.workspace.selectedKols.clear();
recalculateWorkspaceMetrics();
invalidateOperationsCaches_();
applyCampaignWorkspaceUpdate_(state.campaignDetail);
refreshCampaignSummariesInBackground();
showToast(result.updated + ' KOL(s) updated instantly.');
} catch (error) { showToast(error.message || String(error), true); setActionBusy(button, false); }
};
</script>
