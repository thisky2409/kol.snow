<script>
'use strict';
/* Campaign Workspace v1.5.0 extends the stable core UI. */
state.workspace = {
selectedKols: new Set(),
kolQuery: '',
bookingFilter: 'All',
kolSort: 'creator-asc',
contentSort: 'schedule-asc',
returnCampaignId: '',
preferredCampaignId: '',
};
const legacyHandleMainClickV131 = handleMainClick;
const legacyHandleMainInputV131 = handleMainInput;
const legacyHandleMainChangeV131 = handleMainChange;
const legacyHandleModalSubmitV131 = handleModalSubmit;
const legacyRenderCampaignTabV131 = renderCampaignTab;
openCampaign = async function (id) {
state.view = 'campaigns';
state.campaignDetail = null;
state.campaignTab = 'Overview';
state.workspace.selectedKols.clear();
state.workspace.kolQuery = '';
state.workspace.bookingFilter = 'All';
document.querySelectorAll('.nav-item').forEach(function (item) {
item.classList.toggle('active', item.dataset.view === 'campaigns');
});
main.innerHTML = '<div class="skeleton"></div>';
try {
state.campaignDetail = await server('getCampaignWorkspace', id);
persistUiState_();
renderCampaignDetail();
window.scrollTo({ top: 0, behavior: 'smooth' });
} catch (error) {
showPageError(error);
}
};
renderCampaignDetail = function () {
const data = state.campaignDetail;
if (!data) return;
const campaign = data.campaign;
const canManage = canManageCampaignWorkspace();
const canEditContent = canManageContentWorkspace();
const operationTabs = canManage ? (campaign.Market === 'VN' ? ['Contracts', 'Payments'] : ['Payments']) : [];
const tabs = ['Overview', 'KOLs', 'Content', 'Performance'].concat(operationTabs);
const briefUrl = safeWorkspaceUrl(campaign.Brief_URL);
const briefAction = briefUrl
? '<a class="ghost-button link-button" href="' + escapeAttr(briefUrl) + '" target="_blank" rel="noopener">Open brief ↗</a>'
: '<button class="ghost-button" type="button" disabled>No brief</button>';
const editAction = canManage ? '<button class="ghost-button" data-action="edit-campaign">Edit campaign</button>' : '';
const addAction = canEditContent ? '<button class="primary-button" data-action="add-kols-current">＋ Add KOLs</button>' : '';
main.innerHTML = '<button class="back-button" data-action="back-campaigns">← All campaigns</button>' +
'<section class="campaign-hero">' + appTile(campaign.App, campaign.Market) +
'<div class="campaign-hero-main"><div><span class="campaign-id">' + escapeHtml(campaign.Campaign_ID) + '</span>' + statusBadge(campaign.Status) +
'</div><h1>' + escapeHtml(campaign.App + ' · ' + campaign.Campaign_Name) + '</h1><p>' +
escapeHtml([campaign.Market, campaign.Platforms, dateRange(campaign), campaign.Owner_Email].filter(Boolean).join(' · ')) +
'</p></div><div class="campaign-hero-actions">' + briefAction + editAction + addAction + '</div></section>' +
'<nav class="detail-tabs">' + tabs.map(function (tab) {
return '<button class="' + (state.campaignTab === tab ? 'active' : '') + '" data-action="detail-tab" data-tab="' + tab + '">' +
tab + (tab === 'KOLs' ? '<span>' + data.metrics.totalKols + '</span>' : '') + '</button>';
}).join('') + '</nav><div id="detail-content">' + renderCampaignTab(data) + '</div>';
requestAnimationFrame(installCampaignWorkspaceStickyHeader_);
};
renderCampaignTab = function (data) {
const base = legacyRenderCampaignTabV131(data);
if (state.campaignTab === 'Performance') return campaignPerformanceTab(data.deliverables || []);
if (state.campaignTab !== 'Overview') return base;
const metrics = data.metrics || {};
const canSeeFinance = ['Admin', 'Booking'].includes(state.user.Role);
const alerts = [
{ value: metrics.missingContracts || 0, label: 'Confirmed KOLs without signed contract', action: 'Contracts', tone: 'amber', financeOnly: true },
{ value: metrics.overdueDeliverables || 0, label: 'Overdue content items', action: 'Content', tone: 'danger', financeOnly: false },
{ value: metrics.pendingPayments || 0, label: 'Payments still open', action: 'Payments', tone: 'blue', financeOnly: true },
].filter(function (item) { return !item.financeOnly || canSeeFinance; });
if (!alerts.length) return base;
return base + '<section class="card workflow-alerts"><div class="card-head"><div><p class="eyebrow">Workflow control</p><h2>Needs attention</h2></div><span class="status status-blue">Live</span></div><div class="workflow-alert-grid">' +
alerts.map(function (item) {
return '<button data-action="detail-tab" data-tab="' + item.action + '"><strong class="alert-' + item.tone + '">' + item.value + '</strong><span>' + escapeHtml(item.label) + '</span><small>Open ' + item.action + ' →</small></button>';
}).join('') + '</div></section>';
};
campaignKolsTable = function (rows) {
if (!rows.length) return emptyState('◎', 'No KOLs in this campaign', 'Open KOL Database, select accounts and add them to this campaign.', '<button class="primary-button" data-action="add-kols-current">Open database</button>');
const query = state.workspace.kolQuery.toLowerCase();
const filtered = rows.filter(function (row) {
if (state.workspace.bookingFilter !== 'All' && row.Booking_Status !== state.workspace.bookingFilter) return false;
if (!query) return true;
return [row.Username, row.Display_Name, row.Platform, row.PIC_Email, row.Categories].join(' ').toLowerCase().indexOf(query) >= 0;
});
const sortedFiltered = groupCampaignKolRowsByCreator_(sortCampaignRows_(filtered, state.workspace.kolSort, 'kols'));
const visibleIds = {};
sortedFiltered.forEach(function (row) { visibleIds[row.Campaign_KOL_ID] = true; });
Array.from(state.workspace.selectedKols).forEach(function (id) {
if (!rows.some(function (row) { return row.Campaign_KOL_ID === id; })) state.workspace.selectedKols.delete(id);
});
const allSelected = sortedFiltered.length && sortedFiltered.every(function (row) { return state.workspace.selectedKols.has(row.Campaign_KOL_ID); });
const statuses = workspaceLists().bookingStatuses || ['Picked','Approved','Contacted','Negotiating','Confirmed','Declined','Cancelled'];
const canManage = canManageCampaignWorkspace();
const canEditContent = canManageContentWorkspace();
const canApproveBooking = canApproveCampaignKolWorkspace();
const canEditNotes = canEditCampaignKolNotesWorkspace();
const showContracts = canManage && state.campaignDetail && state.campaignDetail.campaign.Market === 'VN';
const financeHeaders = showContracts ? '<th class="campaign-col-contract">Contract</th>' : '';
const paymentHeader = canManage ? '<th class="campaign-col-payment">Payment</th>' : '';
const bookingStatusOptions = workspaceLists().bookingStatuses || ['Picked','Approved','Contacted','Negotiating','Confirmed','Declined','Cancelled'];
const contentStatusOptions = workspaceLists().contentStatuses || ['Not started', 'Draft submitted', 'Need edit', 'Approved', 'Posted'];
const creatorPlatformCounts = {};
sortedFiltered.forEach(function (row) {
const key = row.Creator_ID || row.Campaign_KOL_ID;
creatorPlatformCounts[key] = (creatorPlatformCounts[key] || 0) + 1;
});
const renderedCreatorKeys = {};
const market = String(state.campaignDetail && state.campaignDetail.campaign.Market || '');
const showAfterPit = market === 'VN';
const showVndFee = market === 'TH' || market === 'TW';
const commercialHeaders = '<th class="campaign-col-code-ad">Code ad fee</th>' +
(showAfterPit ? '<th class="campaign-col-gross">Gross amount</th>' : '') +
(showVndFee ? '<th class="campaign-col-fee-vnd">Fee (VND)</th>' : '');
const noteHeader = '<th class="campaign-col-note">Note</th>';
// Order and widths follow what Booking actually needs to see first. This used to
// sum to 2,284px inside a 978px area with Content, Payment and PIC all past the
// fold — the three columns Booking uses most. The status trio now sits directly
// after the identity columns, and money detail, Note and PIC move right.
//
// Order must stay in lockstep with the <thead> and the row cells below:
//   select, creator | Account, Booking, Net, Content, [Payment], [Contract],
//   Code ad, [Gross], [Fee VND], Draft, Note, PIC, actions
const campaignKolColumnWidths = [
44, 200, 130, 130, 130, 130
];
if (canManage) campaignKolColumnWidths.push(110);
if (showContracts) campaignKolColumnWidths.push(110);
campaignKolColumnWidths.push(130);
if (showAfterPit) campaignKolColumnWidths.push(140);
if (showVndFee) campaignKolColumnWidths.push(140);
// actions: 80 -> 124. Trong 80px, tru padding o 2x11px chi con 58px cho cap nut
// Edit + Remove (~100px) nen chu "Remove" bi cat mat - moi th/td bang nay deu
// overflow: hidden nen khong the tran ra. Note 150 -> 130 bu lai, tong bang
// chi tang 24px.
campaignKolColumnWidths.push(90, 130, 120, 124);
const campaignKolTableWidth = campaignKolColumnWidths.reduce(function (total, width) {
return total + width;
}, 0);
const campaignKolColgroup = '<colgroup>' + campaignKolColumnWidths.map(function (width) {
return '<col style="width:' + width + 'px">';
}).join('') + '</colgroup>';
const bulkField = 'Booking_Status';
const bulkLabel = 'Update booking';
const bulkDefault = 'Contacted';
return '<section class="table-card card workspace-table campaign-sticky-table-card"><div class="workspace-toolbar"><div><strong>' + filtered.length + '</strong><span> of ' + rows.length + ' KOL accounts</span></div>' +
'<input id="campaign-kol-query" placeholder="Search creator, platform or PIC" value="' + escapeAttr(state.workspace.kolQuery) + '">' +
'<select id="campaign-booking-filter"><option>All</option>' + optionList(statuses, state.workspace.bookingFilter) + '</select>' +
campaignSortControl_('campaign-kol-sort', state.workspace.kolSort, [
['creator-asc', 'Creator A → Z'],
['creator-desc', 'Creator Z → A'],
['platform-asc', 'Platform A → Z'],
['followers-desc', 'Followers: high → low'],
['booking-asc', 'Booking workflow'],
['net-desc', 'Net amount: high → low'],
['gross-desc', 'Gross amount: high → low'],
['pic-asc', 'PIC A → Z'],
]) + '</div>' +
// Bulk bar KHÔNG còn render tại đây (F23). Nó nằm sâu trong .table-card, mà thẻ đó là
// overflow: hidden, nên cuộn xuống là mất control trong khi vẫn còn dòng đang chọn.
// Giờ updateCampaignBulkBar_ ghi vào #bulk-bar-host — phần tử top-level trong
// Index.html — và được gọi ở cuối renderCampaignTab, tức mọi lần đổi selection.
'' +
'<div class="table-scroll campaign-kol-scroll"><table class="data-table campaign-kol-table" style="width:' + campaignKolTableWidth + 'px;min-width:' + campaignKolTableWidth + 'px;max-width:none">' + campaignKolColgroup + '<thead><tr><th class="campaign-col-select"><input id="campaign-select-visible" type="checkbox"' + (allSelected ? ' checked' : '') + '></th><th class="campaign-col-creator">Creator</th><th>Account</th><th>Booking</th><th class="campaign-col-net">Net amount</th><th class="campaign-col-content">Content</th>' + paymentHeader + financeHeaders + commercialHeaders + '<th class="campaign-col-draft">Draft</th>' + noteHeader + '<th class="campaign-col-pic">PIC</th><th></th></tr></thead><tbody>' +
(sortedFiltered.length ? sortedFiltered.map(function (row) {
const profile = safeWorkspaceUrl(row.Profile_URL);
const draftUrl = safeWorkspaceUrl(row.Draft_URL);
const canEditInline = canManage || canApproveBooking;
const rowBookingStatusOptions = canManage
? bookingStatusOptions
: Array.from(new Set([row.Booking_Status || 'Picked', 'Approved']));
const creatorKey = row.Creator_ID || row.Campaign_KOL_ID;
const platformCount = creatorPlatformCounts[creatorKey] || 1;
const multiPlatform = platformCount > 1;
const renderCreatorCell = !renderedCreatorKeys[creatorKey];
renderedCreatorKeys[creatorKey] = true;
const creatorCell = renderCreatorCell
? '<td class="campaign-col-creator campaign-creator-group-cell" rowspan="' + platformCount + '"><div class="creator-cell">' + avatar(row.Display_Name || row.Username, row.Market) + '<div><strong>' + escapeHtml(row.Display_Name || row.Username || '—') + '</strong>' + (row.Categories ? '<small>' + escapeHtml(row.Categories) + '</small>' : '') + (multiPlatform ? '<b class="multi-platform-flag">' + platformCount + ' platforms</b>' : '') + '</div></div></td>'
: '';
const commercialCells = '<td class="campaign-col-code-ad">' + (canManage
? '<div class="campaign-inline-editor"><input class="campaign-extra-input" data-campaign-inline-field="Code_Ad_Fee" data-campaign-kol-id="' + escapeAttr(row.Campaign_KOL_ID) + '" data-original-value="' + escapeAttr(String(row.Code_Ad_Fee || 0)) + '" value="' + escapeAttr(formatInputNumber(row.Code_Ad_Fee || 0)) + '" inputmode="numeric" data-numeric-input aria-label="Code ad fee"><span class="campaign-save-indicator" aria-live="polite"></span></div>'
: '<strong>' + money(row.Code_Ad_Fee || 0, row.Currency) + '</strong>') + '</td>' +
(showAfterPit ? '<td class="campaign-col-gross"><div class="campaign-money-cell" title="' + escapeAttr(money(row.Gross_Amount || row.After_PIT_Fee || 0, 'VND')) + '">' + (canManage
? '<strong data-gross-amount>' + money(row.Gross_Amount || row.After_PIT_Fee || 0, 'VND') + '</strong><small class="cell-sub">Auto calculated</small>'
: '<strong>' + money(row.Gross_Amount || row.After_PIT_Fee || 0, 'VND') + '</strong>') + '</div></td>' : '') +
(showVndFee ? '<td class="campaign-col-fee-vnd"><div class="campaign-money-cell"><strong>' + money(row.Fee_VND || 0, 'VND') + '</strong><small class="cell-sub">Auto FX</small></div></td>' : '');
// Note was the last cell of commercialCells, which pinned it inside the money
// block. It is a low-priority column, so it now renders near the end.
const noteCell = '<td class="campaign-col-note">' + (canEditNotes ? '<div class="campaign-inline-editor"><input class="campaign-extra-input campaign-extra-text" data-campaign-inline-field="Notes" data-campaign-kol-id="' + escapeAttr(row.Campaign_KOL_ID) + '" data-original-value="' + escapeAttr(row.Notes || '') + '" value="' + escapeAttr(row.Notes || '') + '" placeholder="Add note"><span class="campaign-save-indicator" aria-live="polite"></span></div>' : escapeHtml(row.Notes || '—')) + '</td>';
const bookingCell = '<td>' + (canEditInline ? inlineStatusSelect('Booking_Status', row.Booking_Status, row.Campaign_KOL_ID, rowBookingStatusOptions) : statusBadge(row.Booking_Status)) + '</td>';
const netCell = '<td class="campaign-col-net">' + (canManage
? '<div class="campaign-fee-editor"><input type="text" inputmode="numeric" data-numeric-input data-campaign-inline-field="Final_Fee" data-campaign-kol-id="' + escapeAttr(row.Campaign_KOL_ID) + '" data-original-value="' + escapeAttr(String(campaignKolNetAmountClient_(row))) + '" value="' + escapeAttr(formatInputNumber(campaignKolNetAmountClient_(row))) + '" aria-label="Net amount"><small>' + escapeHtml(row.Currency || '') + '</small><span class="campaign-save-indicator" aria-live="polite"></span></div>'
: '<strong>' + money(campaignKolNetAmountClient_(row), row.Currency) + '</strong>') + '</td>';
const contentCell = '<td class="campaign-col-content">' + (canEditContent ? inlineStatusSelect('Content_Status', row.Content_Status, row.Campaign_KOL_ID, contentStatusOptions) : statusBadge(row.Content_Status)) + '</td>';
const paymentCell = canManage ? '<td class="campaign-col-payment">' + statusBadge(row.Payment_Status) + '</td>' : '';
const contractCell = showContracts ? '<td class="campaign-col-contract">' + statusBadge(row.Contract_Status) + '</td>' : '';
const draftCell = '<td class="campaign-col-draft">' + (draftUrl ? '<a href="' + escapeAttr(draftUrl) + '" target="_blank" rel="noopener">Draft ↗</a>' : '<span class="cell-sub">—</span>') + '</td>';
const picCell = '<td class="campaign-col-pic" title="' + escapeAttr(row.PIC_Email || '') + '">' + escapeHtml(row.PIC_Email || '—') + '</td>';
const actionsCell = '<td>' + (canManage
? '<div class="row-actions"><button class="mini-edit-button" data-action="edit-campaign-kol" data-id="' + escapeAttr(row.Campaign_KOL_ID) + '">Edit</button>' +
'<button class="mini-remove-button" data-action="remove-campaign-kol" data-id="' + escapeAttr(row.Campaign_KOL_ID) + '">Remove</button></div>'
: '') + '</td>';
return '<tr class="' + (multiPlatform ? 'creator-multi-platform' : '') + (renderCreatorCell ? ' creator-group-start' : ' creator-group-continuation') + '" data-campaign-extra-row="' + escapeAttr(row.Campaign_KOL_ID) + '"><td class="campaign-col-select"><input type="checkbox" data-campaign-kol-checkbox="' + escapeAttr(row.Campaign_KOL_ID) + '"' + (state.workspace.selectedKols.has(row.Campaign_KOL_ID) ? ' checked' : '') + '></td>' +
creatorCell +
'<td>' + platformBadge(row.Platform) + '<small class="cell-sub">@' + escapeHtml(row.Username || '—') + ' · ' + compactNumber(row.Followers || 0) + '</small>' + (profile ? '<a href="' + escapeAttr(profile) + '" target="_blank" rel="noopener">Profile ↗</a>' : '') + '</td>' +
bookingCell + netCell + contentCell + paymentCell + contractCell + commercialCells + draftCell + noteCell + picCell + actionsCell + '</tr>';
}).join('') : '<tr><td colspan="' + campaignKolColumnWidths.length + '"><div class="inline-empty">No KOLs match this filter.</div></td></tr>') +
'</tbody></table></div></section>';
};
deliverablesTable = function (rows) {
const canManage = canManageCampaignWorkspace();
const canEditContent = canManageContentWorkspace();
const actions = (canManage ? '<button class="ghost-button" data-action="generate-deliverables">Generate from confirmed</button>' : '') + (canEditContent ? '<button class="ghost-button" data-action="import-performance-csv">⇧ Import performance CSV</button><button class="primary-button" data-action="new-deliverable">＋ Deliverable</button>' : '');
const contentSortControl = campaignSortControl_('campaign-content-sort', state.workspace.contentSort, [
['schedule-asc', 'Posting date: earliest'],
['schedule-desc', 'Posting date: latest'],
['creator-asc', 'Creator A → Z'],
['creator-desc', 'Creator Z → A'],
['platform-asc', 'Platform A → Z'],
['status-asc', 'Status workflow'],
['draft-desc', 'Draft submitted: newest'],
['post-desc', 'Post submitted: newest'],
['updated-desc', 'Recently updated'],
]);
const actionsWrap = '<div class="workspace-actions campaign-content-actions">' + contentSortControl + actions + '</div>';
if (!rows.length) return '<section class="workspace-section-head"><div><p class="eyebrow">Content operations</p><h2>Deliverables</h2></div>' + actionsWrap + '</section>' + emptyState('✎', 'No deliverables yet', 'Generate one deliverable for every confirmed KOL, or add one manually.', '');
const sortedRows = sortCampaignRows_(rows, state.workspace.contentSort, 'content');
const statuses = workspaceLists().contentStatuses || ['Not started', 'Draft submitted', 'Need edit', 'Approved', 'Posted'];
return '<section class="workspace-section-head"><div><p class="eyebrow">Content operations</p><h2>' + rows.length + ' deliverables</h2></div>' + actionsWrap + '</section><section class="table-card card workspace-table content-workspace-table campaign-sticky-table-card"><div class="table-scroll"><table class="data-table"><thead><tr><th>Creator</th><th>Deliverable</th><th>Status</th><th>Draft</th><th>Feedback</th><th>Post</th><th></th></tr></thead><tbody>' + sortedRows.map(function (row) {
const draftUrl = safeWorkspaceUrl(row.Draft_URL);
const postUrl = safeWorkspaceUrl(row.Post_URL);
const draftCell = draftUrl
? '<div class="deliverable-link-line"><small class="cell-sub">Submitted ' + escapeHtml(workspaceDateTime(row.Draft_Submitted_At) || '—') + '</small><a href="' + escapeAttr(draftUrl) + '" target="_blank" rel="noopener">Draft ↗</a>' + quickDeliverableEditor(row, 'draft', canEditContent) + '</div>'
: '<div class="deliverable-link-line"><small class="cell-sub">Due ' + escapeHtml(workspaceDate(row.Draft_Due) || '—') + '</small><span class="cell-sub">No link yet</span>' + quickDeliverableEditor(row, 'draft', canEditContent) + '</div>';
const postCell = postUrl
? '<div class="deliverable-link-line"><small class="cell-sub">Posted ' + escapeHtml(workspaceDate(row.Posting_Date) || '—') + '</small><a href="' + escapeAttr(postUrl) + '" target="_blank" rel="noopener">Post ↗</a>' + quickDeliverableEditor(row, 'post', canEditContent) + '</div>'
: '<div class="deliverable-link-line"><small class="cell-sub">Expected ' + escapeHtml(workspaceDate(row.Posting_Date) || '—') + '</small><span class="cell-sub">No link yet</span>' + quickDeliverableEditor(row, 'post', canEditContent) + '</div>';
const feedbackCount = Number(row.Feedback_Count || 0);
const latest = String(row.Latest_Feedback || '');
const feedbackCell = '<button class="feedback-cell' + (feedbackCount ? ' has-feedback' : '') + '" data-action="content-feedback" data-id="' + escapeAttr(row.Deliverable_ID) + '">' +
'<span>' + (feedbackCount ? ('Round ' + feedbackCount) : 'No feedback') + '</span>' +
'<small>' + escapeHtml(latest || (canEditContent ? 'Add feedback' : 'View history')) + '</small></button>';
const statusCell = canEditContent
? '<select class="status-select status-' + statusTone(row.Content_Status) + '" data-deliverable-status="' + escapeAttr(row.Deliverable_ID) + '" data-campaign-kol="' + escapeAttr(row.Campaign_KOL_ID) + '">' + optionList(statuses, row.Content_Status) + '</select>'
: statusBadge(row.Content_Status);
return '<tr><td><strong>' + escapeHtml(row.Display_Name || row.Username || '—') + '</strong><small class="cell-sub">@' + escapeHtml(row.Username || '—') + '</small></td><td><strong>' + escapeHtml(row.Type || '—') + '</strong><small class="cell-sub">' + platformBadge(row.Platform) + '</small></td><td>' + statusCell + '</td><td>' + draftCell + '</td><td>' + feedbackCell + '</td><td>' + postCell + '</td><td>' + (canEditContent
  ? '<div class="row-actions"><button class="mini-edit-button" data-action="edit-deliverable" data-id="' + escapeAttr(row.Deliverable_ID) + '">Edit all</button>' +
    // Delete tách khỏi Edit: Marketing vẫn sửa được deliverable (saveDeliverable cho
    // phép) nhưng KHÔNG xoá được nữa (F05). Trước đây cả hai cùng gate bằng
    // canEditContent, nên Marketing thấy nút Delete và giờ nó sẽ luôn báo lỗi quyền —
    // một nút không bao giờ chạy được thì tệ hơn là không có nút.
    (canManage
      ? '<button class="mini-remove-button" data-action="delete-deliverable" data-id="' + escapeAttr(row.Deliverable_ID) + '">Delete</button>'
      : '') + '</div>'
  : '') + '</td></tr>';
}).join('') + '</tbody></table></div></section>';
};
/**
 * Vẽ bulk-action bar vào #bulk-bar-host (F23).
 *
 * Host nằm NGOÀI #main, mà delegation click/change chỉ gắn trên #main, nên các control
 * ở đây phải được gắn handler TRỰC TIẾP — đúng cách updateSelectionBar làm cho
 * #selection-bar. Nếu dựa vào data-action như trước thì nút sẽ im lặng không làm gì.
 *
 * Selection nằm ở state.workspace.selectedKols nên nó sống qua mọi lần cuộn và mọi lần
 * render lại; hàm này chỉ phản chiếu state đó.
 */
function updateCampaignBulkBar_() {
const host = document.getElementById('bulk-bar-host');
if (!host) return;
const count = state.workspace.selectedKols.size;
const onCampaignOverview = state.view === 'campaigns' && state.campaignDetail &&
state.campaignTab === 'Overview';
if (!count || !onCampaignOverview || !canManageCampaignWorkspace()) {
host.classList.add('is-hidden');
host.innerHTML = '';
return;
}
const statuses = workspaceLists().bookingStatuses ||
['Picked','Approved','Contacted','Negotiating','Confirmed','Declined','Cancelled'];
// Giữ ĐÚNG ba giá trị mà bản render cũ dùng (CampaignWorkspace.html ~146-148) —
// đây là di chuyển chỗ hiển thị, không đổi hành vi bulk update.
const bulkField = 'Booking_Status';
const bulkLabel = 'Update booking';
const bulkDefault = 'Contacted';
host.classList.remove('is-hidden');
host.innerHTML = '<div class="bulk-bar"><span><strong>' + count + '</strong> selected — bulk update:</span>' +
'<select id="bulk-booking-value" data-field="' + escapeAttr(bulkField) + '">' +
optionList(statuses, bulkDefault) + '</select>' +
'<button class="primary-button" id="bulk-booking-apply">' + escapeHtml(bulkLabel) + '</button></div>';
const apply = document.getElementById('bulk-booking-apply');
if (apply) apply.onclick = function () { return runBulkBookingUpdate(apply); };
}
let campaignStickyHeaderObserver_ = null;
function installCampaignWorkspaceStickyHeader_() {
if (campaignStickyHeaderObserver_) {
campaignStickyHeaderObserver_.disconnect();
campaignStickyHeaderObserver_ = null;
}
const card = document.querySelector('.campaign-sticky-table-card');
if (!card) return;
const oldSticky = card.querySelector('.campaign-sticky-header');
if (oldSticky) oldSticky.remove();
const scroll = card.querySelector('.table-scroll');
const sourceTable = scroll && scroll.querySelector('.data-table');
const sourceHead = sourceTable && sourceTable.querySelector('thead');

queued.payload = Object.assign({}, payload, queued.payload);
queued.inputs = Object.assign({}, inputs, queued.inputs);
queued.retries = (queued.retries || 0) + 1;
const message = error.message || String(error);
const giveUp = queued.retries > 3;
Object.keys(inputs).forEach(function (field) {
const input = inputs[field];
if (!input || !input.isConnected) return;
// The typed value is still sitting in the box, so without an explicit marker the
// user has every reason to believe the edit saved. Previously the only trace was
// a 14px dot with no text and no tooltip, plus a 4s toast in the far corner.
input.classList.add('is-unsaved');
input.setAttribute('aria-invalid', 'true');
input.title = (giveUp ? 'NOT SAVED — ' : 'Not saved yet, retrying — ') + message;
const indicator = input.parentElement && input.parentElement.querySelector('.campaign-save-indicator');
if (indicator) {
indicator.className = 'campaign-save-indicator is-error';
indicator.title = input.title;
}
});
// Nothing used to schedule a retry. The payload was merged back into the queue
// but was only ever flushed if the user happened to edit the same row again, so a
// dropped connection silently lost a fee edit.
campaignInlineSaveQueue_.set(id, queued);
if (giveUp) {
showToast('Not saved: ' + message + '. Your change is still on screen but was not saved — edit the field again to retry.', true);
} else {
clearTimeout(queued.timer);
queued.timer = setTimeout(function () { flushCampaignInlineSave(id); }, 800 * queued.retries);
if (queued.retries === 1) showToast(message, true);
}
}
}

function updateFeeTotalPreview() {

const input = form.querySelector('[name="' + name + '"]');
return input ? Number(stripNumberFormatting(input.value)) || 0 : 0;
};
const readRaw = function (name) {
const input = form.querySelector('[name="' + name + '"]');
return input ? String(input.value).trim() : '';
};
// Presence, not truthiness — a Net amount deliberately typed as 0 stays 0.
const baseFee = readRaw('Final_Fee') !== '' ? readNum('Final_Fee') : readNum('Quoted_Fee');
const market = String(state.campaignDetail && state.campaignDetail.campaign.Market || '');
const baseWithCodeAd = baseFee + readNum('Code_Ad_Fee');
// Dùng chung calculateContractTaxClient_ (Scripts.html) thay vì viết lại công thức
// `>= 5000000 ? /0.9` lần thứ ba. Phần đọc input giữ nguyên vì nó phải xử lý số đã
// được format trong form.
const total = market === 'VN'
? Math.round(baseWithCodeAd) + calculateContractTaxClient_(baseWithCodeAd)
: baseFee + readNum('Tax') + readNum('Service_Fee');
preview.textContent = formatNumber(total);
}

const rows = (state.campaignDetail && state.campaignDetail.campaignKols) || [];
const query = state.workspace.kolQuery.toLowerCase();
return rows.filter(function (row) {
if (state.workspace.bookingFilter !== 'All' && row.Booking_Status !== state.workspace.bookingFilter) return false;
return !query || [row.Username, row.Display_Name, row.Platform, row.PIC_Email, row.Categories].join(' ').toLowerCase().indexOf(query) >= 0;
});
}
function campaignKolOptions(selected) {
return state.campaignDetail.campaignKols.map(function (row) {
const label = (row.Display_Name || row.Username || row.Account_ID) + ' · ' + (row.Platform || 'Account');
return '<option value="' + escapeAttr(row.Campaign_KOL_ID) + '"' + (row.Campaign_KOL_ID === selected ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
}).join('');
}
function workspaceLists() {
return (state.campaignDetail && state.campaignDetail.lists) || {};
}
function optionList(items, selected) {
return (items || []).map(function (item) {
return '<option value="' + escapeAttr(item) + '"' + (String(item) === String(selected) ? ' selected' : '') + '>' + escapeHtml(item) + '</option>';
}).join('');
}
function workspaceDate(value) {
return value ? String(value).slice(0, 10) : '';
}
function safeWorkspaceUrl(value) {
const url = String(value || '').trim();
return /^https?:\/\//i.test(url) ? url : '';
}
function workspaceModalActions(label) {
return '<div class="modal-actions"><button type="button" class="ghost-button" data-close-modal>Cancel</button><button type="submit" class="primary-button">' + escapeHtml(label) + '</button></div>';
}
function canManageCampaignWorkspace() {
return ['Admin', 'Booking'].indexOf(state.user.Role) >= 0;
}
function canManageFinanceWorkspace() {
return ['Admin', 'Booking'].indexOf(state.user.Role) >= 0;
}
// Marketing team: được phép chọn KOL vào campaign, check draft và cập nhật
// Content_Status, nhưng KHÔNG được đụng vào Booking/Contract/Fee/Payment.
function canManageContentWorkspace() {
return ['Admin', 'Booking', 'Marketing'].indexOf(state.user.Role) >= 0;
}
function canApproveCampaignKolWorkspace() {
return ['Admin', 'Booking', 'Marketing'].indexOf(state.user.Role) >= 0;
}
function canEditCampaignKolNotesWorkspace() {
return ['Admin', 'Booking', 'Marketing'].indexOf(state.user.Role) >= 0;
}
function setActionBusy(button, busy, label) {
if (!button) return;
if (!button.dataset.originalLabel) button.dataset.originalLabel = button.textContent;
button.disabled = busy;
button.textContent = busy ? (label || 'Working…') : button.dataset.originalLabel;
}
</script>
