async function init() {

function bindShellEvents() {

document.addEventListener('keydown', function (event) {
if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {

function isTrueClient(value) {
return value === true || String(value || '').toLowerCase() === 'true';
}
function workspaceDateTimeClient(value) {
const date = new Date(value);
if (isNaN(date.getTime())) return '';
return new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(date);
}
function updateNotificationBadge() {
const dot = document.getElementById('notification-dot');
if (!dot) return;
const count = Number((state.notifications && state.notifications.unread) || 0);
dot.classList.toggle('is-hidden', count === 0);
dot.title = count ? (count + ' unread notification(s)') : 'No unread notifications';
}

// Thanh phân trang dùng chung cho Operations và History. Cùng lớp .pagination và cùng

// `scope` đi vào data-scope để một handler xử lý được cả ba danh sách.
function operationsPagination(scope, page) {
const total = Number(page.total || 0);
const offset = Number(page.offset || 0);
const pageSize = Number(page.pageSize || 0);
const shown = Number((page.rows || []).length);
if (!total) return '';
const atStart = offset === 0;
const atEnd = offset + pageSize >= total;
const btn = function (action, label, disabled) {

(disabled ? ' disabled' : '') + '>' + label + '</button>';
};
return '<div class="pagination"><span>Showing <strong>' + (offset + 1) + '–' +
(offset + shown) + '</strong> of <strong>' + formatNumber(total) + '</strong></span><div>' +
btn('ops-first', '⇤ First', atStart) + btn('ops-prev', '← Previous', atStart) +
btn('ops-next', 'Next →', atEnd) + btn('ops-last', 'Last ⇥', atEnd) + '</div></div>';
}

/**
* Đổi trang cho một danh sách Operations: đặt offset mới, xoá bản cache của đúng danh
* sách đó rồi render lại. Chỉ xoá cache của scope đang đổi trang, để hai tab kia không
* phải gọi lại server.
*/
async function setOperationsPage(scope, nextOffset) {
const total = scope === 'contracts'
? Number((state.operations.contractData || {}).contractsTotal || 0)
: Number((state.operations[scope] || {}).total || 0);
const pageSize = scope === 'contracts'
? Number((state.operations.contractData || {}).pageSize || 0)
: Number((state.operations[scope] || {}).pageSize || 0);
const maxOffset = Math.max(0, total - 1);
const target = nextOffset === 'last'
? Math.max(0, (Math.ceil(total / Math.max(1, pageSize)) - 1) * pageSize)
: Math.max(0, Math.min(maxOffset, Number(nextOffset)));
state.operationsPaging[scope] = target;
if (scope === 'contracts') state.operations.contractData = null;
else state.operations[scope] = null;
if (scope === 'history') return renderHistory();
return renderOperations(scope);
}

function summarizePerformanceClient(rows) {
const summary = { Posts: rows.length, Live_Posts: 0, Views: 0, Likes: 0, Comments: 0, Reposts: 0, Shares: 0, Saves: 0, Engagements: 0, Engagement_Rate: 0 };
rows.forEach(function (row) {
if (row.Post_URL || row.Content_Status === 'Posted') summary.Live_Posts += 1;
['Views','Likes','Comments','Reposts','Shares','Saves'].forEach(function (field) { summary[field] += Number(row[field] || 0); });
});
summary.Engagements = summary.Likes + summary.Comments + summary.Reposts + summary.Shares + summary.Saves;
summary.Engagement_Rate = summary.Views ? summary.Engagements / summary.Views * 100 : 0;
return summary;
}

/** Trim helper for values that arrive from the sheet as '' or a Date. */
function cleanTextClient_(value) {
return String(value === null || typeof value === 'undefined' ? '' : value).trim();
}
// Bon the so lieu nay dung o CA HAI cho: tab Performance va tab Performance cua
// tung campaign. Truoc day moi ben tu dung rieng, nen ben campaign van con icon
// Unicode/emoji cu (mui ten, trai tim, dau %) trong khi tab Performance da doi
// sang METRIC_ICONS, nhan the khac nhau ("Views" vs "Total views"), va tu cong
// mot bo tong rieng. Cung mot campaign ma hai man hinh trinh bay khac nhau.
// Gio chi con MOT nguon, va summarizePerformanceClient cung dung chung.
function performanceMetricCards_(summary) {
return '<section class="metric-grid performance-metrics">' +
metric('Live posts', summary.Live_Posts || 0, (summary.Posts || 0) + ' deliverables tracked', 'blue', METRIC_ICONS.livePosts) +
metric('Total views', compactNumber(summary.Views || 0), formatNumber(summary.Views || 0) + ' views', 'violet', METRIC_ICONS.views) +
metric('Engagements', compactNumber(summary.Engagements || 0), 'Likes, comments, reposts, shares and saves', 'mint', METRIC_ICONS.engagements) +
// Khong co luot xem thi ER khong xac dinh. In "0.00%" trong nhu da do duoc va
// ket qua bang 0 - cung ly do bang da doi sang dau gach ngang.
metric('Engagement rate', summary.Views ? Number(summary.Engagement_Rate || 0).toFixed(2) + '%' : '\u2014', 'Based on total views', 'amber', METRIC_ICONS.engagementRate) +
'</section>';
}
function performanceTable(rows) {
if (!rows.length) return emptyState('↗', 'No performance data yet', 'Add post URLs in campaign Content, then import or fetch performance metrics.', '');
const groups = {};
rows.forEach(function (row) {
const key = row.Campaign_ID || 'Unassigned';
if (!groups[key]) groups[key] = [];
groups[key].push(row);
});
return Object.keys(groups).map(function (campaignId) {
const campaignRows = groups[campaignId];
const first = campaignRows[0] || {};
const groupSummary = summarizePerformanceClient(campaignRows);
return '<section class="table-card card performance-table campaign-performance-group"><div class="table-summary"><span><strong>' + escapeHtml((first.App ? first.App + ' · ' : '') + (first.Campaign_Name || campaignId)) + '</strong><small>' + campaignRows.length + ' post(s) · ' + compactNumber(groupSummary.Views) + ' views · ' + groupSummary.Engagement_Rate.toFixed(2) + '% ER</small></span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Creator</th><th>Platform</th><th>Post date</th><th>Views</th><th>Likes</th><th>Comments</th><th>Reposts</th><th>Shares</th><th>Saves</th><th>ER</th><th>Updated</th><th></th></tr></thead><tbody>' +
campaignRows.map(function (row) {
const engagements = Number(row.Likes || 0) + Number(row.Comments || 0) + Number(row.Reposts || 0) + Number(row.Shares || 0) + Number(row.Saves || 0);
// An empty cell means nobody has measured this post. Rendering it through
// formatNumber(x || 0) printed a hard "0", which is indistinguishable from a post
// that genuinely got zero views — and after the team-API work most empty cells are
// exactly that: a metric the platform does not publish, deliberately left unwritten.
// A real 0 still prints as 0; only an absent value becomes a dash.
const perfNum = function (value) {
return (value === '' || value === null || typeof value === 'undefined')
? '<span class="cell-sub">—</span>'
: formatNumber(value);
};
const measured = Number(row.Views || 0) > 0;
const postHref = safeWorkspaceUrl(row.Post_URL); const postUrl = postHref ? '<a href="' + escapeAttr(postHref) + '" target="_blank" rel="noopener">Post ↗</a>' : '—';
return '<tr><td><strong>' + escapeHtml(row.Display_Name || row.Username || '—') + '</strong><small class="cell-sub">' + escapeHtml(row.Username ? '@' + row.Username : '') + '</small></td><td>' + platformBadge(row.Platform) + '</td><td>' +
escapeHtml(workspaceDate(row.Posting_Date) || '—') + '</td><td><strong>' + perfNum(row.Views) + '</strong></td><td>' + perfNum(row.Likes) + '</td><td>' + perfNum(row.Comments) + '</td><td>' + perfNum(row.Reposts) + '</td><td>' + perfNum(row.Shares) + '</td><td>' + perfNum(row.Saves) + '</td><td><strong>' +
// Engagement rate is undefined without views, so it shows a dash rather than a
// confident 0.00%. And the Updated column used to fall back to row.Updated_At,
// which made a never-measured post look like it had been fetched at the moment
// someone last edited the record.
(measured ? (engagements / Number(row.Views) * 100).toFixed(2) + '%' : '<span class="cell-sub">—</span>') +
'</strong></td><td><small class="cell-sub">' +
(cleanTextClient_(row.Performance_Updated_At)
? escapeHtml(workspaceDateTimeClient(row.Performance_Updated_At)) +
(row.Performance_Source ? '<br>' + escapeHtml(row.Performance_Source) : '')
: 'Never measured') + '</small></td><td><div class="row-actions">' + postUrl + '</div></td></tr>';
}).join('') + '</tbody></table></div></section>';
}).join('');
}

async function pollWorkspaceChanges_() {
